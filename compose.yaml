name: aquafhir

services:
  bridge:
    build: .
    environment:
      DATABASE_PATH: /data/aquafhir.db
      FHIR_BASE_URL: http://hapi:8080/fhir
      FHIR_WRITE_ENABLED: "true"
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET:-local-demo-secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-pro-preview}
      GEMINI_ASSIST_MODE: ${GEMINI_ASSIST_MODE:-auto}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-0}
      UMLS_API_KEY: ${UMLS_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - bridge-data:/data
    depends_on:
      hapi:
        condition: service_healthy

  hapi:
    image: hapiproject/hapi:v8.10.0-3
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:///app/config/aquafhir-hapi.yaml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hapi-local-only}
    configs:
      - source: hapi_config
        target: /app/config/aquafhir-hapi.yaml
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "HealthCheck"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hapi-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi -d hapi"]
      interval: 5s
      timeout: 5s
      retries: 20

configs:
  hapi_config:
    file: ./infra/hapi/application.yaml

volumes:
  bridge-data:
  postgres-data:
