name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # The suite must never need a key or the network. Pinning it empty here
      # keeps the no-key fallback path continuously verified.
      - run: pytest --cov=aquafhir --cov-report=term-missing
        env:
          GEMINI_API_KEY: ""

